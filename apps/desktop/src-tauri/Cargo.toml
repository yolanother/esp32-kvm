[package]
name = "esp32-kvm-desktop"
version = "0.1.1"
edition.workspace = true
license-file.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
esp32-kvm-input-core = { path = "../../../crates/input-core" }
esp32-kvm-host-actor = { path = "../../../crates/host-actor" }
esp32-kvm-platform-windows = { path = "../../../crates/platform-windows" }
esp32-kvm-edge-policy = { path = "../../../crates/edge-policy" }
esp32-kvm-topology-core = { path = "../../../crates/topology-core" }
esp32-kvm-usb-transport = { path = "../../../crates/usb-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4.10.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
